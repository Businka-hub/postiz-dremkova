# postiz.dremkova.com -> 127.0.0.1:4007 (container postiz, compose /opt/postiz/deploy)
# The 443 block is added by `certbot --nginx -d postiz.dremkova.com`.
server {
    listen 80;
    listen [::]:80;
    server_name postiz.dremkova.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    client_max_body_size 1G;   # videos for Reels/TikTok
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:4007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }
}
